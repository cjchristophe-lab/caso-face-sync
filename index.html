<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASØ DIGITAL ENTITY</title><style>*{box-sizing:border-box}body{margin:0;background:#030408;color:white;font:14px system-ui;overflow:hidden}canvas{position:absolute;width:100%;height:100%}#ui{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,650px);max-height:48vh;overflow:auto;padding:12px;background:#111827dd;border:1px solid #ffffff25;border-radius:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,label,select{background:#202633;color:white;border:1px solid #ffffff30;border-radius:8px;padding:10px;cursor:pointer}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}audio{width:100%;height:34px}h1{position:absolute;top:18px;left:24px;font-size:18px;letter-spacing:6px;font-weight:400}body.immersive #ui,body.immersive h1{display:none}</style><canvas></canvas><h1>CASØ / DIGITAL ENTITY</h1><div id="ui"><label>Importer musique<input id="music" type="file" ></label><label>Voix seule (option)<input id="voice" type="file" ></label><select id="mode"><option value="mix">Fusion</option><option value="wire">Hologramme</option><option value="dots">Particules</option></select><input id="color" type="color" value="#ff204d"><button id="full">Plein écran</button><button id="play">▶ Lecture</button><audio id="player" controls playsinline preload="metadata"></audio><small id="filename" style="width:100%;overflow-wrap:anywhere"></small><small id="status">Importe une musique. La piste voix seule améliore la réaction de la bouche.</small></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),p=document.querySelector('#player'),v=new Audio();let ac,a,b,da,db,hasVoice=false;const $=id=>document.getElementById(id);let musicURL,voiceURL;v.preload='auto';v.setAttribute('playsinline','');function status(t){$('status').textContent=t}function setup(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Analyse audio non disponible');ac=new AC();a=ac.createAnalyser();b=ac.createAnalyser();a.fftSize=b.fftSize=1024;da=new Uint8Array(a.frequencyBinCount);db=new Uint8Array(b.frequencyBinCount);ac.createMediaElementSource(p).connect(a);a.connect(ac.destination);ac.createMediaElementSource(v).connect(b);const mute=ac.createGain();mute.gain.value=0;b.connect(mute).connect(ac.destination)}
$('music').onchange=e=>{const f=e.target.files[0];if(!f)return;p.pause();if(musicURL)URL.revokeObjectURL(musicURL);musicURL=URL.createObjectURL(f);p.src=musicURL;p.load();$('filename').textContent=f.name;status('Fichier sélectionné — appuie sur Lecture.');e.target.value=''};
$('voice').onchange=e=>{const f=e.target.files[0];if(!f)return;v.pause();if(voiceURL)URL.revokeObjectURL(voiceURL);voiceURL=URL.createObjectURL(f);v.src=voiceURL;v.load();hasVoice=true;p.pause();status('Voix sélectionnée : '+f.name+' — appuie sur Lecture.');e.target.value=''};
function sync(){if(hasVoice&&v.readyState>=1){try{v.currentTime=p.currentTime}catch(e){}}}v.onloadedmetadata=sync;v.onerror=()=>{hasVoice=false;status('Voix illisible : animation sur la musique seule.')};p.onerror=()=>status('Fichier audio illisible (code '+(p.error?.code||'?')+'). Essaie un MP3, WAV ou M4A.');p.onloadedmetadata=()=>status('Audio prêt — appuie sur Lecture.');
$('play').onclick=()=>{if(!musicURL){status('Choisis une musique dans Fichiers.');return}if(!p.paused){p.pause();return}try{setup();ac.resume().catch(e=>status('Audio : '+e.message));sync();if(hasVoice)v.play().catch(e=>{hasVoice=false;status('Voix indisponible : '+e.message)});p.play().catch(e=>status('Lecture impossible : '+e.message))}catch(e){status('Erreur audio : '+e.message)}};
p.onplay=()=>{try{setup();ac.resume().catch(e=>status(e.message));sync();if(hasVoice&&v.paused)v.play().catch(()=>{hasVoice=false})}catch(e){status(e.message)}$('play').textContent='❚❚ Pause'};p.onpause=()=>{v.pause();$('play').textContent='▶ Lecture'};p.onseeking=sync;p.onended=()=>{v.pause();$('play').textContent='▶ Lecture'};$('full').onclick=()=>{document.body.classList.add('immersive');document.documentElement.requestFullscreen?.().catch(()=>{})};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('immersive')});c.ondblclick=()=>{document.body.classList.remove('immersive');if(document.fullscreenElement)document.exitFullscreen()};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('immersive')});
let W,H;function resize(){W=c.width=innerWidth*Math.min(devicePixelRatio,2);H=c.height=innerHeight*Math.min(devicePixelRatio,2)}onresize=resize;resize();let pts=[];const rings=64,cols=96;for(let i=0;i<=rings;i++){let lat=-Math.PI/2+i*Math.PI/rings;for(let j=0;j<cols;j++){let lon=j*2*Math.PI/cols, y=Math.sin(lat),x=Math.cos(lat)*Math.sin(lon),z=Math.cos(lat)*Math.cos(lon);let front=Math.max(0,z),jaw=1-.27*Math.max(0,-y);x*=.72*jaw;let eye=Math.exp(-((Math.abs(x)-.28)**2/.017+(y-.19)**2/.014));let nose=Math.exp(-(x*x/.012+(y+.02)**2/.065));z=z*.66+front*(.18*nose-.12*eye);pts.push({x,y,z,front,i,j,r:Math.random()})}}let mouth=0,bass=0;function avg(d,l,h){let s=0;for(let i=l;i<h;i++)s+=d[i]||0;return s/(h-l)/255}function draw(ms){requestAnimationFrame(draw);let t=ms/1000;g.fillStyle='#030408';g.fillRect(0,0,W,H);let voice=0,beat=0;if(a&&!p.paused){a.getByteFrequencyData(da);b.getByteFrequencyData(db);beat=avg(da,1,7);let d=hasVoice?db:da;voice=avg(d,7,65)}mouth+=((Math.max(0,voice-.12)*1.9)-mouth)*.3;bass+=(beat-bass)*.2;let s=Math.min(W,H)*.34,cx=W/2,cy=H*(document.body.classList.contains('immersive')?.5:.43),ang=Math.sin(t*.6)*.19,co=Math.cos(ang),si=Math.sin(ang),color=$('color').value,mode=$('mode').value;let glow=g.createRadialGradient(cx,cy,0,cx,cy,s*1.7);glow.addColorStop(0,color+'22');glow.addColorStop(1,'#03040800');g.fillStyle=glow;g.fillRect(0,0,W,H);let projected=[];for(let q of pts){let x=q.x,y=q.y,z=q.z;let lip=Math.exp(-(x*x/.10+(y+.39)**2/.015))*q.front;y+=Math.sign(y+.39)*mouth*.15*lip;let scatter=(mode==='wire'?0:Math.pow(bass,3)*.17)*Math.sin(q.r*70+t*4);x+=scatter*Math.sin(q.r*42);y+=scatter*Math.cos(q.r*37);z+=scatter;let X=x*co+z*si,Z=z*co-x*si,k=3/(3-Z);projected.push([cx+X*s*k,cy-y*s*k,Z,q])}g.strokeStyle=color;g.lineWidth=devicePixelRatio*.65;if(mode!=='dots'){for(let i=0;i<projected.length;i++){let [x,y,z,q]=projected[i];if(z<-.04||q.i%3!==0&&q.j%4!==0)continue;let n=projected[q.i%3===0?(i-q.j+(q.j+1)%cols):i+cols];if(!n||n[2]<-.04)continue;g.globalAlpha=.12+.35*Math.max(0,z);g.beginPath();g.moveTo(x,y);g.lineTo(n[0],n[1]);g.stroke()}}if(mode!=='wire'){g.fillStyle=color;for(let [x,y,z,q] of projected){if(z<-.03||q.r<.28)continue;g.globalAlpha=.12+Math.max(0,z)*.8;let r=(.65+q.r*.9+bass*.8)*devicePixelRatio;g.fillRect(x,y,r,r)}}g.globalAlpha=1;function feature(x,y){let z=.66;return [cx+(x*co+z*si)*s*3/(3-z*co+x*si),cy-y*s*3/(3-z*co+x*si)]}g.shadowColor=color;g.shadowBlur=15*devicePixelRatio;g.strokeStyle=color;g.lineWidth=2*devicePixelRatio;for(let x of [-.28,.28]){let [ex,ey]=feature(x,.19);g.beginPath();g.ellipse(ex,ey,s*.12,s*.035,0,0,Math.PI*2);g.stroke()}let [mx,my]=feature(0,-.39);g.beginPath();g.ellipse(mx,my,s*(.16-mouth*.035),s*(.012+mouth*.10),0,0,Math.PI*2);g.stroke();g.shadowBlur=0;g.globalAlpha=.45;g.fillStyle=color;for(let i=0;i<100;i++){let r=Math.sin(i*78.3)*.5+.5,angle=i*2.4+t*.08,rad=s*(1.1+r*.9);g.fillRect(cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad,devicePixelRatio,devicePixelRatio)}g.globalAlpha=1}requestAnimationFrame(draw);
</script></html>
