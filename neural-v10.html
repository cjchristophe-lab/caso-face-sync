const vs=`attribute vec2 pos; void main(){gl_Position=vec4(pos,0.,1.);}`;

const c=document.querySelector('canvas'),p=document.querySelector('#player');let ac,a,da,musicURL,localURL;const $=id=>document.getElementById(id);function status(t){$('status').textContent=t;$('status').classList.toggle('error',/erreur|impossible|illisible|introuvable/i.test(t));}function setup(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();a=ac.createAnalyser();a.fftSize=2048;a.smoothingTimeConstant=.35;da=new Uint8Array(a.frequencyBinCount);ac.createMediaElementSource(p).connect(a);a.connect(ac.destination);}

let bass=0,mid=0,high=0,baseline=0,prev=0,kick=0,lastHit=-10,period=.5,phase=0,previous=0,nextBlink=2,blinkStart=-10,energy=0;

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.01,100);camera.position.set(0,0,5);

const morphs=[];const skin=new THREE.MeshPhysicalMaterial({color:0x263d59,metalness:.94,roughness:.24,clearcoat:1,clearcoatRoughness:.15,envMapIntensity:1.25});
const clock={value:0},pulse={value:0},circuit={value:1};skin.onBeforeCompile=shader=>{shader.uniforms.neuralTime=clock;shader.uniforms.neuralPulse=pulse;shader.uniforms.circuit=circuit;shader.vertexShader='varying vec3 neuralPos;\n'+shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n neuralPos=position;');shader.fragmentShader='varying vec3 neuralPos; uniform float neuralTime; uniform float neuralPulse; uniform float circuit;\n'+shader.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
vec3 q=neuralPos*0.006; vec2 cell=fract(q.xy*vec2(1.0,1.7));float line=1.0-smoothstep(.012,.045,min(abs(cell.x-.5),abs(cell.y-.5)));float mask=step(.62,fract(sin(floor(q.x)*17.1+floor(q.y)*31.7)*43758.5));totalEmissiveRadiance+=mix(vec3(.01,.55,.8),vec3(.35,.03,.8),.5+.5*sin(q.x)) * circuit * line * mask * (.15+neuralPulse*.8+.15*sin(neuralTime*2.+q.y));`);};
model.traverse(o=>{if(!o.isMesh)return;if(o.morphTargetDictionary){morphs.push(o);o.material=skin;}else if(o.parent?.name?.startsWith('eye')){if(o.material){o.material=o.material.clone();o.material.envMapIntensity=.8;}}});

const styles={chrome:[0x263d59,.94,.24,0,1.25,.7],neural:[0x101d35,.65,.32,0,1.1,2.8],glass:[0x86cfff,.05,.12,.88,1.4,1.6],glitch:[0x48174f,.85,.22,0,1.5,2.2],cinema:[0x393d48,.78,.35,0,1.5,.25]};
const names=Object.keys(styles), selector=document.getElementById('style'), audio=document.getElementById('player');

if(!audio.paused && t-lastSwitch>9 && f.bass>.48 && f.bass>slowBass+.075){autoIndex=(autoIndex+1)%names.length;lastSwitch=t;}
const mode=selector.value==='auto'?names[autoIndex]:selector.value;const v=styles[mode];const k=1-Math.exp(-dt*4);goalColor.setHex(v[0]);skin.color.lerp(goalColor,k);for(const [key,target] of [['metalness',v[1]],['roughness',v[2]],['transmission',v[3]],['envMapIntensity',v[4]]])skin[key]+=(target-skin[key])*k;circuit.value+=(v[5]-circuit.value)*k;

if(mode==='neural')pulse.value=Math.min(2,f.bass*1.8+.3);if(mode==='glitch'){cyan.intensity+=f.bass*2;violet.intensity+=f.bass*3;}
}

// Living Entity: independent facial channels with frame-rate independent easing.
const facial={};let lastFrame=performance.now(), headX=0,headY=0,headZ=0, previousMouth=0, accent=0;
function animateMorph(name,target,dt,speed=12){const v=facial[name]||0;facial[name]=v+(THREE.MathUtils.clamp(target,0,1)-v)*(1-Math.exp(-dt*speed));set(name,facial[name]);}

 const oldMouth=previousMouth;const t=f.t,m=THREE.MathUtils.clamp(f.mouth,0,1),w=f.lipWidth,active=!audio.paused;

 for(const side of ['L','R']){
 const sign=side==='L'?1:-1,asym=1+sign*Math.sin(t*.87)*.16;
 a('eyeBlink_'+side,f.blink,35);a('eyeSquint_'+side,emotion*.16*asym);a('eyeWide_'+side,accent*.13);
 a('eyeLookIn_'+side,Math.max(0,gx*sign));a('eyeLookOut_'+side,Math.max(0,-gx*sign));a('eyeLookUp_'+side,Math.max(0,gy));a('eyeLookDown_'+side,Math.max(0,-gy));

});
}catch(e){console.error(e);status.textContent='Erreur 3D : '+e.message;status.classList.add('error');}
